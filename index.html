<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fully Alive | Home • Work • Church</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        .cinzel { font-family: 'Cinzel', serif; }
        
        .split-pane {
            transition: width 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .pane-entrepreneur {
            background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)), 
                        url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&q=80&w=1500');
            background-size: cover; background-position: center;
        }
        
        .pane-shepherd {
            background: linear-gradient(rgba(120, 53, 15, 0.7), rgba(120, 53, 15, 0.7)), 
                        url('https://images.unsplash.com/photo-1438232992991-995b7058bbb3?auto=format&fit=crop&q=80&w=1500');
            background-size: cover; background-position: center;
        }

        .pane-content {
            opacity: 0.9;
            transition: all 0.5s ease;
        }

        .split-pane:hover { width: 60% !important; }
        .split-pane:hover .pane-content { opacity: 1; transform: scale(1.05); }
        .other-pane:hover { width: 40% !important; }

        .cross-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            pointer-events: none;
        }
        
        @media (max-width: 768px) {
            body { overflow-y: auto; }
            .split-container { flex-direction: column; height: auto !important; }
            .split-pane { width: 100% !important; height: 50vh; }
        }
    </style>
</head>
<body class="bg-slate-950 text-white">

    <div class="split-container flex h-screen w-full relative">
        
        <!-- Central Spiritual Anchor -->
        <div class="cross-center text-center hidden md:block">
            <div class="bg-slate-900/80 backdrop-blur-xl p-6 rounded-full border border-amber-500/30 shadow-[0_0_50px_rgba(251,191,36,0.2)]">
                <i class="fas fa-cross text-amber-500 text-5xl"></i>
            </div>
            <div class="mt-4 cinzel text-xs tracking-[0.5em] text-amber-500 font-bold uppercase">Fully Alive</div>
        </div>

        <!-- Left: Entrepreneur Path -->
        <a href="marketplace.html" class="split-pane pane-entrepreneur w-1/2 flex items-center justify-center p-12 group">
            <div class="pane-content text-center z-10">
                <span class="text-amber-500 font-bold uppercase tracking-[0.4em] text-xs mb-4 block">Marketplace Track</span>
                <h2 class="text-4xl lg:text-6xl font-bold cinzel mb-6 leading-tight">The Kingdom <br>Entrepreneur</h2>
                <p class="text-slate-300 max-w-sm mx-auto mb-8 font-light italic">"I build businesses that fund the Kingdom"</p>
                <div class="inline-block bg-white text-slate-950 px-8 py-3 rounded-full font-black uppercase text-xs tracking-widest group-hover:bg-amber-500 transition-colors">
                    Enter Track
                </div>
            </div>
        </a>

        <!-- Right: Shepherd Path -->
        <a href="kingdom.html" class="split-pane pane-shepherd w-1/2 flex items-center justify-center p-12 group border-l border-white/10">
            <div class="pane-content text-center z-10">
                <span class="text-amber-200 font-bold uppercase tracking-[0.4em] text-xs mb-4 block">Ecclesial Track</span>
                <h2 class="text-4xl lg:text-6xl font-bold cinzel mb-6 leading-tight">The Kingdom <br>Shepherd</h2>
                <p class="text-amber-100 max-w-sm mx-auto mb-8 font-light italic">"I rebirth churches that multiply impact"</p>
                <div class="inline-block bg-white text-slate-950 px-8 py-3 rounded-full font-black uppercase text-xs tracking-widest group-hover:bg-amber-500 transition-colors">
                    Enter Track
                </div>
            </div>
        </a>

    </div>

    <!-- Mobile Bottom Overlay -->
    <div class="md:hidden absolute bottom-0 w-full p-6 text-center bg-gradient-to-t from-slate-950 to-transparent">
        <p class="text-xs uppercase tracking-widest text-slate-400">Fully Alive: Home • Work • Church</p>
    </div>

</body>
</html>
